en:{back:"← Back to Home",kick:"Family Amenities Guide · Pattaya",t_title:"Water Slides & Pool Villas in Pattaya: Where to Stay in 2026",t_intro:"Search “villa with water slide Pattaya” and you'll see how rare it is. A private pool is common; a private water slide is not. This guide is for families where the slide is non-negotiable.",s1_h:"Why water slides are the #1 family amenity",s1_p:"A slide turns a villa pool into a home waterpark. Kids play for hours while parents relax in sight; no queues, no crowds, no closing time — unlike public waterparks where a day costs ~฿1,000+ per person. At a slide villa the “ticket” is included daily, and the environment is private and controllable.",s2_h:"Where to stay: private water slides at Massarossa",s2_king:"<b>King Family VIP</b> — slide + billiards + karaoke, 3BR/2BA, 250 m², 8 guests (+2). From ฿4,900/night.",s2_princess:"<b>Princess</b> — romantic villa with cozy slide + hot tub, 3BR/2BA, 200 m², 8 guests (+2). From ฿4,600/night.",s2_more:"Three more villas (Luxury, Royal SPA, Queen) each have their own private pool; all five share 500+ Mbps WiFi, BBQ, full kitchens, pet-friendly policy and 24/7 gated security, 5 min from Terminal 21.",s3_h:"Water-slide stays: quick comparison",s3_table:"<table><tr><th>Option</th><th>Slide</th><th>Pool</th><th>Crowds</th><th>Family cost</th></tr><tr><td>Massarossa slide villas</td><td>Private, 24/7</td><td>Private per villa</td><td>None</td><td>฿4,600–4,900/night whole group</td></tr><tr><td>Waterpark hotel</td><td>Shared, queues</td><td>Shared</td><td>High</td><td>Rooms + daily tickets</td></tr><tr><td>Typical pool villa</td><td>None</td><td>Private</td><td>None</td><td>Similar, no kids' wow</td></tr></table>",s4_h:"Best area: North Pattaya",s4_p:"Quiet gated communities, easy food delivery, quick access to Terminal 21, the beach, Alcazar and Art in Paradise — while Walking Street nightlife stays far away.",s5_h:"5 checks before booking a slide villa",s5_list:"<ol><li>Confirm the slide is private (yours, not shared).</li><li>Ask pool depth & safe zones for toddlers.</li><li>Check real WiFi speed (Massarossa 500+ Mbps).</li><li>Verify gated security 24/7.</li><li>Book direct for best rate (−15%) & flexible check-in.</li></ol>",faq_h:"FAQ",faq_html:"<div class='faq'><div class='q'>Which villas in Pattaya have private water slides?</div><p>King Family VIP and Princess at Massarossa — one of the few private-slide setups in Pattaya.</p><div class='q'>Are slides shared?</div><p>No — each slide belongs to one villa only.</p><div class='q'>How many pools does Massarossa have?</div><p>5 private pools — one per villa.</p><div class='q'>How much is a slide villa?</div><p>King from ฿4,900/night; Princess from ฿4,600/night.</p></div>",cta_sub:"See the water slides in action.",seeall:"See All 5 Villas",book:"Book via WhatsApp"},
ua:{back:"← На головну",kick:"Гід для сімей · Паттайя",t_title:"Водні гірки та пул-вілли в Паттайї: де зупинитися у 2026",t_intro:"Введіть «вілла з водною гіркою Паттайя» — і побачите, яка це рідкість. Приватний басейн — звично; приватна гірка — ні. Цей гід — для сімей, у яких гірка обов'язкова.",s1_h:"Чому гірка — зручність №1 для сімей",s1_p:"Гірка перетворює басейн на домашній аквапарк. Діти граються годинами, батьки відпочивають у зоні видимості; без черг і натовпу — на відміну від аквапарків, де день коштує ~฿1,000+ з людини. У віллі «квиток» включений щодня, а середовище приватне.",s2_h:"Де жити: приватні гірки у Massarossa",s2_king:"<b>King Family VIP</b> — гірка + більярд + караоке, 3сп/2ван, 250 м², 8 гостей (+2). Від ฿4,900/ніч.",s2_princess:"<b>Princess</b> — романтична вілла з гіркою + гарячою ванною, 3сп/2ван, 200 м², 8 гостей (+2). Від ฿4,600/ніч.",s2_more:"Ще три вілли (Luxury, Royal SPA, Queen) мають власні приватні басейни; усі п'ять — WiFi 500+ Мбіт/с, BBQ, кухні, pet-friendly, охорона 24/7, за 5 хв від Terminal 21.",s3_h:"Проживання з гіркою: порівняння",s3_table:"<table><tr><th>Варіант</th><th>Гірка</th><th>Басейн</th><th>Натовп</th><th>Вартість</th></tr><tr><td>Вілли Massarossa з гіркою</td><td>Приватна, 24/7</td><td>Приватний</td><td>Немає</td><td>฿4,600–4,900/ніч на компанію</td></tr><tr><td>Готель при аквапарку</td><td>Спільна, черги</td><td>Спільний</td><td>Великий</td><td>Номери + квитки</td></tr><tr><td>Типова пул-вілла</td><td>Немає</td><td>Приватний</td><td>Немає</td><td>Схожа, без «вау»</td></tr></table>",s4_h:"Найкращий район: Північна Паттайя",s4_p:"Тихі закриті спільноти, зручна доставка, швидкий доступ до Terminal 21, пляжу, Alcazar і Art in Paradise — а нічне життя Walking Street далеко.",s5_h:"5 перевірок перед бронюванням",s5_list:"<ol><li>Переконайтеся, що гірка приватна.</li><li>Запитайте глибину та безпечні зони для малечі.</li><li>Перевірте швидкість WiFi (у Massarossa 500+ Мбіт/с).</li><li>Уточніть охорону 24/7.</li><li>Бронюйте напряму (−15%) та гнучкий заїзд.</li></ol>",faq_h:"FAQ",faq_html:"<div class='faq'><div class='q'>Які вілли мають приватні гірки?</div><p>King Family VIP та Princess у Massarossa — один із небагатьох таких форматів у Паттайї.</p><div class='q'>Гірки спільні?</div><p>Ні — кожна гірка належить лише одній віллі.</p><div class='q'>Скільки басейнів у Massarossa?</div><p>5 приватних басейнів — по одному на віллу.</p><div class='q'>Скільки коштує вілла з гіркою?</div><p>King від ฿4,900/ніч; Princess від ฿4,600/ніч.</p></div>",cta_sub:"Дивіться гірки в дії.",seeall:"Усі 5 вілл",book:"Бронювати у WhatsApp"},
ru:{back:"← На главную",kick:"Гид для семей · Паттайя",t_title:"Водные горки и пул-виллы в Паттайе: где остановиться в 2026",t_intro:"Введите «вилла с водной горкой Паттайя» — и увидите, какая это редкость. Частный бассейн — обычно; частная горка — нет. Гид для семей, у которых горка обязательна.",s1_h:"Почему горка — удобство №1 для семей",s1_p:"Горка превращает бассейн в домашний аквапарк. Дети играют часами, родители отдыхают в зоне видимости; без очередей — в отличие от аквапарков, где день стоит ~฿1,000+ с человека. В вилле «билет» включён ежедневно.",s2_h:"Где жить: частные горки в Massarossa",s2_king:"<b>King Family VIP</b> — горка + бильярд + караоке, 3сп/2вн, 250 м², 8 гостей (+2). От ฿4,900/ночь.",s2_princess:"<b>Princess</b> — романтичная вилла с горкой + горячей ванной, 3сп/2вн, 200 м², 8 гостей (+2). От ฿4,600/ночь.",s2_more:"Ещё три виллы (Luxury, Royal SPA, Queen) имеют собственные бассейны; все пять — WiFi 500+ Мбит/с, BBQ, кухни, pet-friendly, охрана 24/7, в 5 мин от Terminal 21.",s3_h:"Проживание с горкой: сравнение",s3_table:"<table><tr><th>Вариант</th><th>Горка</th><th>Бассейн</th><th>Толпа</th><th>Стоимость</th></tr><tr><td>Виллы Massarossa с горкой</td><td>Частная, 24/7</td><td>Частный</td><td>Нет</td><td>฿4,600–4,900/ночь на компанию</td></tr><tr><td>Отель при аквапарке</td><td>Общая, очереди</td><td>Общий</td><td>Большая</td><td>Номера + билеты</td></tr><tr><td>Типичная пул-вилла</td><td>Нет</td><td>Частный</td><td>Нет</td><td>Похожая, без «вау»</td></tr></table>",s4_h:"Лучший район: Северная Паттайя",s4_p:"Тихие закрытые сообщества, доставка еды, быстрый доступ к Terminal 21, пляжу, Alcazar и Art in Paradise — а ночная жизнь Walking Street далеко.",s5_h:"5 проверок перед бронированием",s5_list:"<ol><li>Убедитесь, что горка частная.</li><li>Спросите глубину и безопасные зоны.</li><li>Проверьте скорость WiFi (500+ Мбит/с).</li><li>Уточните охрану 24/7.</li><li>Бронируйте напрямую (−15%) и гибкий заезд.</li></ol>",faq_h:"FAQ",faq_html:"<div class='faq'><div class='q'>Какие виллы с частными горками?</div><p>King Family VIP и Princess в Massarossa — один из немногих таких форматов.</p><div class='q'>Горки общие?</div><p>Нет — каждая горка принадлежит одной вилле.</p><div class='q'>Сколько бассейнов?</div><p>5 частных бассейнов — по одному на виллу.</p><div class='q'>Сколько стоит вилла с горкой?</div><p>King от ฿4,900/ночь; Princess от ฿4,600/ночь.</p></div>",cta_sub:"Смотрите горки в действии.",seeall:"Все 5 вилл",book:"Бронировать в WhatsApp"},

zh:{back:"← 返回首页",kick:"家庭指南 · 芭提雅",t_title:"芭提雅水滑梯泳池别墅：2026住哪里",t_intro:"搜索“芭提雅 水滑梯 别墅”会发现它多么稀缺。私人泳池常见，私人水滑梯却不然。本指南写给“滑梯必备”的家庭。",s1_h:"为什么水滑梯是家庭第一配置",s1_p:"滑梯把别墅泳池变成家庭水上乐园。孩子玩几小时，父母在视线内放松；不用排队——不像水上乐园每人每天约฿1,000+。在别墅“门票”每天包含。",s2_h:"住哪里：Massarossa 的私人水滑梯",s2_king:"<b>King Family VIP</b> — 滑梯+台球+卡拉OK，3卧2卫，250㎡，8人(+2)。฿4,900/晚起。",s2_princess:"<b>Princess</b> — 浪漫别墅带滑梯+热水浴缸，3卧2卫，200㎡，8人(+2)。฿4,600/晚起。",s2_more:"另外三栋（Luxury、Royal SPA、Queen）各有私人泳池；五栋均配500+ Mbps WiFi、烧烤、厨房、宠物友好、24/7安保，距Terminal 21 5分钟。",s3_h:"滑梯住宿快速对比",s3_table:"<table><tr><th>选项</th><th>滑梯</th><th>泳池</th><th>人群</th><th>家庭成本</th></tr><tr><td>Massarossa 滑梯别墅</td><td>私人24/7</td><td>私人</td><td>无</td><td>฿4,600–4,900/晚 全组</td></tr><tr><td>水上乐园酒店</td><td>共用排队</td><td>共用</td><td>多</td><td>房费+门票</td></tr><tr><td>普通泳池别墅</td><td>无</td><td>私人</td><td>无</td><td>相近，无“哇”</td></tr></table>",s4_h:"最佳区域：北芭提雅",s4_p:"安静封闭社区，外卖方便，快速到达Terminal 21、海滩、Alcazar和Art in Paradise——Walking Street夜生活很远。",s5_h:"预订前5个检查",s5_list:"<ol><li>确认滑梯私有。</li><li>询问泳池深度和幼儿安全区。</li><li>核实WiFi速度（500+ Mbps）。</li><li>确认24/7安保。</li><li>直接预订（−15%）灵活入住。</li></ol>",faq_h:"常见问题",faq_html:"<div class='faq'><div class='q'>哪些别墅有私人水滑梯？</div><p>Massarossa 的 King Family VIP 和 Princess——芭提雅少有的配置。</p><div class='q'>滑梯共用吗？</div><p>不——每个滑梯只属于一栋别墅。</p><div class='q'>Massarossa 有几个泳池？</div><p>5个私人泳池——每栋一个。</p><div class='q'>滑梯别墅多少钱？</div><p>King ฿4,900/晚起；Princess ฿4,600/晚起。</p></div>",cta_sub:"看水滑梯实拍。",seeall:"查看全部5栋",book:"WhatsApp预订"},
ko:{back:"← 홈으로",kick:"가족 가이드 · 파타야",t_title:"파타야 워터슬라이드 풀빌라: 2026 숙박 가이드",t_intro:"“파타야 워터슬라이드 빌라”를 검색하면 얼마나 드문지 알 수 있습니다. 프라이빗 풀은 흔하지만 프라이빗 슬라이드는 아닙니다. 슬라이드가 필수인 가족을 위한 가이드입니다.",s1_h:"워터슬라이드가 가족 1순위인 이유",s1_p:"슬라이드는 빌라 풀을 홈 워터파크로 바꿉니다. 아이는 몇 시간 놀고 부모는 시야 안에서 휴식; 줄과 군중 없음 — 워터파크는 1인 1일 ~฿1,000+지만 빌라는 매일 포함.",s2_h:"숙박: Massarossa의 프라이빗 슬라이드",s2_king:"<b>King Family VIP</b> — 슬라이드+당구+카라오케, 3침2욕, 250㎡, 8인(+2). ฿4,900/박부터.",s2_princess:"<b>Princess</b> — 로맨틱 빌라, 슬라이드+온수 욕조, 3침2욕, 200㎡, 8인(+2). ฿4,600/박부터.",s2_more:"나머지 3동(Luxury, Royal SPA, Queen)도 각자 프라이빗 풀; 5동 모두 500+ Mbps WiFi, BBQ, 주방, 펫 프렌들리, 24/7 보안, Terminal 21까지 5분.",s3_h:"슬라이드 숙박 비교",s3_table:"<table><tr><th>옵션</th><th>슬라이드</th><th>풀</th><th>군중</th><th>가족 비용</th></tr><tr><td>Massarossa 슬라이드 빌라</td><td>프라이빗 24/7</td><td>프라이빗</td><td>없음</td><td>฿4,600–4,900/박 전체</td></tr><tr><td>워터파크 호텔</td><td>공용, 줄</td><td>공용</td><td>많음</td><td>객실+티켓</td></tr><tr><td>일반 풀빌라</td><td>없음</td><td>프라이빗</td><td>없음</td><td>비슷, ‘와우’ 없음</td></tr></table>",s4_h:"최고 지역: 북파타야",s4_p:"조용한 게이트 커뮤니티, 배달 용이, Terminal 21·해변·Alcazar·Art in Paradise 빠른 접근 — Walking Street는 멀리.",s5_h:"예약 전 5가지 체크",s5_list:"<ol><li>슬라이드가 사유인지 확인.</li><li>수심과 유아 안전 구역 문의.</li><li>WiFi 속도 확인(500+ Mbps).</li><li>24/7 보안 확인.</li><li>직접 예약(−15%) 유연 체크인.</li></ol>",faq_h:"FAQ",faq_html:"<div class='faq'><div class='q'>어떤 빌라에 프라이빗 슬라이드가 있나요?</div><p>Massarossa의 King Family VIP와 Princess — 파타야에서 드문 구성.</p><div class='q'>슬라이드가 공용인가요?</div><p>아니요 — 각 슬라이드는 한 빌라 전용.</p><div class='q'>Massarossa 풀은 몇 개?</div><p>프라이빗 풀 5개 — 빌라당 1개.</p><div class='q'>슬라이드 빌라 요금은?</div><p>King ฿4,900/박부터; Princess ฿4,600/박부터.</p></div>",cta_sub:"워터슬라이드 실물 보기.",seeall:"빌라 5동 보기",book:"WhatsApp 예약"}};
