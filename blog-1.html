en:{back:"← Back to Home",kick:"Family Travel Guide · Pattaya",t_title:"Best Family Villas in Pattaya: The Complete 2026 Guide",t_intro:"Planning a family trip to Thailand's beach capital? The accommodation you choose makes or breaks the holiday: cramped hotel rooms and shared pools versus a private pool villa where kids play safely in their own pool while parents work on fast WiFi. This guide gives the verified specs of all 5 Massarossa villas so you can compare honestly.",s1_h:"What is a pool villa — and why families choose them",s1_p:"A pool villa is a standalone house with its own private pool, kitchen and bedrooms. It solves the three biggest hotel pain points: space (everyone in one home), routine (your own kitchen and schedule), and privacy (the pool is yours alone — no crowds, no queues).",s2_h:"The 7 features that make a villa truly family-friendly",s2_list:"<ul><li><b>Private pool in every villa</b> — 5 villas = 5 private pools, never shared.</li><li><b>Water slides</b> — King Family VIP (slide + billiards + karaoke) and Princess (slide + hot tub).</li><li><b>WiFi 500+ Mbps</b> — remote work and 4K streaming in every room.</li><li><b>Real space 197–250 m²</b> — 3 bedrooms, 8 guests (+2 extra; Queen up to 10).</li><li><b>Safety</b> — gated community with 24/7 security.</li><li><b>Kitchen, BBQ, karaoke</b> — save on meals, evening entertainment.</li><li><b>Pet-friendly</b> — ฿500/pet/night, max 2, ≤10 kg.</li></ul>",s3_h:"All 5 Massarossa villas: verified specifications",s3_table:"<table><tr><th>Villa</th><th>BR/BA</th><th>Guests</th><th>Size</th><th>Signature</th><th>Best for</th><th>฿/night</th></tr><tr><td>King Family VIP</td><td>3/2</td><td>8(+2)</td><td>250</td><td>Slide+billiards</td><td>Families</td><td>4,900</td></tr><tr><td>Luxury</td><td>3/3</td><td>8(+2)</td><td>200</td><td>European design</td><td>Couples</td><td>4,500</td></tr><tr><td>Royal SPA</td><td>3/2</td><td>8(+2)</td><td>197</td><td>SPA bath</td><td>Celebrations</td><td>4,500</td></tr><tr> ua:{back:"← На головну",kick:"Сімейний гід · Паттайя",t_title:"Найкращі сімейні вілли в Паттайї: повний гід 2026",t_intro:"Плануєте сімейну поїздку до пляжної столиці Таїланду? Житло вирішує все: тісні номери й спільний басейн — чи приватна вілла, де діти граються у власному басейні, а батьки працюють на швидкісному WiFi. Ось верифіковані характеристики всіх 5 вілл Massarossa для чесного порівняння.",s1_h:"Що таке пул-вілла і чому її обирають сім'ї",s1_p:"Пул-вілла — окремий будинок із власним басейном, кухнею та спальнями. Вона закриває три головні болі готелю: простір (усі в одному домі), ритм (власна кухня й розклад) і приватність (басейн лише ваш — без черг і натовпу).",s2_h:"7 ознак справді сімейної вілли",s2_list:"<ul><li><b>Приватний басейн у кожній віллі</b> — 5 вілл = 5 приватних басейнів, без спільних.</li><li><b>Водні гірки</b> — King Family VIP (гірка + більярд + караоке) та Princess (гірка + гаряча ванна).</li><li><b>WiFi 500+ Мбіт/с</b> — віддалена робота та 4K у кожній кімнаті.</li><li><b>Реальний простір 197–250 м²</b> — 3 спальні, 8 гостей (+2; Queen до 10).</li><li><b>Безпека</b> — закрита спільнота з охороною 24/7.</li><li><b>Кухня, BBQ, караоке</b> — економія на харчуванні, вечірні розваги.</li><li><b>Pet-friendly</b> — ฿500/тварина/ніч, макс 2, до 10 кг.</li></ul>",s3_h:"Усі 5 вілл Massarossa: верифіковані характеристики",s3_table:"<table><tr><th>Вілла</th><th>Сп/Ван</th><th>Гості</th><th>Площа</th><th>Фішка</th><th>Для кого</th><th>฿/ніч</th></tr><tr><td>King Family VIP</td><td>3/2</td><td>8(+2)</td><td>250</td><td>Гірка+більярд</td><td>Сім'ї</td><td>4,900</td></tr><tr><td>Luxury</td><td>3/3</td><td>8(+2)</td><td>200</td><td>Євро-дизайн</td><td>Пари</td><td>4,500</td></tr><tr><td>Royal SPA</td><td>3/2</td><td>8(+2)</td><td>197</td><td>SPA-ванна</td><td>Свята</td><td>4,500</td></tr><tr><td>Princess</td><td>3/2</td><td>8(+2)</td><td>200</td><td>Романтика+гірка</td><td>Медовий місяць</td><td>4,600</td></tr><tr><td>Queen</td><td>3/2</td><td>8(+2=10)</td><td>200</td><td>Infinity</td><td>Друзі/воркейшн</td><td>4,500</td></tr></table>",s4_h:"Що кажуть реальні гості",s4_quotes:"<div class='quote'>“The villa was absolutely stunning. The kids loved the water slide in the VIP villa!”<b>Sarah M. — Австралія</b><small>via Booking.com</small></div><div class='quote'>“Very clean and spacious villa. Great location near Terminal 21.”<b>Li Wei — Китай</b><small>via Agoda</small></div>",s5_h:"Як забронювати сімейну віллу в Паттайї",s5_p:"Бронюйте на Booking.com, Agoda, Airbnb — або напряму: зазвичай це економить до 15% і дає гнучкий заїзд, WhatsApp-консьєржа та бонуси по прибуттю. Говоримо EN / RU / TH / UK.",faq_h:"FAQ",faq_html:"<div class='faq'><div class='q'>Скільки басейнів у Massarossa?</div><p>5 приватних басейнів — по одному в кожній віллі, без спільних.</p><div class='q'>Які вілли мають водні гірки?</div><p>King Family VIP (гірка + більярд + караоке) та Princess (гірка + гаряча ванна).</p><div class='q'>Скільки гостей вміщує кожна вілла?</div><p>8 гостей базово (+2 додаткові по ฿500/ніч). Queen досягає 10.</p><div class='q'>Які додаткові платежі?</div><p>Електрика ฿6/кВт·год; додатковий гість ฿500/ніч; тварина ฿500/ніч (макс 2, до 10 кг); депозит ฿5,000 (повертається).</p></div>",cta_sub:"Дивіться вільні дати, фото та гірки в дії.",seeall:"Усі 5 вілл",book:"Бронювати у WhatsApp"},
ru:{back:"← На главную",kick:"Семейный гид · Паттайя",t_title:"Лучшие семейные виллы в Паттайе: полный гид 2026",t_intro:"Планируете семейную поездку в пляжную столицу Таиланда? Жильё решает всё: тесные номера и общий бассейн — или частная вилла, где дети играют в своём бассейне, а родители работают на быстром WiFi. Вот верифицированные характеристики всех 5 вилл Massarossa для честного сравнения.",s1_h:"Что такое пул-вилла и почему её выбирают семьи",s1_p:"Пул-вилла — отдельный дом с собственным бассейном, кухней и спальнями. Она закрывает три главные боли отеля: пространство (все в одном доме), ритм (своя кухня и расписание) и приватность (бассейн только ваш — без очередей и толпы).",s2_h:"7 признаков действительно семейной виллы",s2_list:"<ul><li><b>Частный бассейн в каждой вилле</b> — 5 вилл = 5 частных бассейнов, без общих.</li><li><b>Водные горки</b> — King Family VIP (горка + бильярд + караоке) и Princess (горка + горячая ванна).</li><li><b>WiFi 500+ Мбит/с</b> — удалёнка и 4K в каждой комнате.</li><li><b>Реальное пространство 197–250 м²</b> — 3 спальни, 8 гостей (+2; Queen до 10).</li><li><b>Безопасность</b> — закрытое сообщество с охраной 24/7.</li><li><b>Кухня, BBQ, караоке</b> — экономия на питании, вечерние развлечения.</li><li><b>Pet-friendly</b> — ฿500/питомец/ночь, макс 2, до 10 кг.</li></ul>",s3_h:"Все 5 вилл Massarossa: верифицированные характеристики",s3_table:"<table><tr><th>Вилла</th><th>Сп/Вн</th><th>Гости</th><th>Площадь</th><th>Фишка</th><th>Для кого</th><th>฿/ночь</th></tr><tr><td>King Family VIP</td><td>3/2</td><td>8(+2)</td><td>250</td><td>Горка+бильярд</td><td>Семьи</td><td>4,900</td></tr><tr><td>Luxury</td><td>3/3</td><td>8(+2)</td><td>200</td><td>Евро-дизайн</td><td>Пары</td><td>4,500</td></tr><tr><td>Royal SPA</td><td>3/2</td><td>8(+2)</td><td>197</td><td>SPA-ванна</td><td>Праздники</td><td>4,500</td></tr><tr><td>Princess</td><td>3/2</td><td>8(+2)</td><td>200</td><td>Романтика+горка</td><td>Медовый месяц</td><td>4,600</td></tr><tr><td>Queen</td><td>3/2</td><td>8(+2=10)</td><td>200</td><td>Infinity</td><td>Друзья/workation</td><td>4,500</td></tr></table>",s4_h:"Что говорят реальные гости",s4_quotes:"<div class='quote'>“The villa was absolutely stunning. The kids loved the water slide in the VIP villa!”<b>Sarah M. — Австралия</b><small>via Booking.com</small></div><div class='quote'>“Very clean and spacious villa. Great location near Terminal 21.”<b>Li Wei — Китай</b><small>via Agoda</small></div>",s5_h:"Как забронировать семейную виллу в Паттайе",s5_p:"Бронируйте на Booking.com, Agoda, Airbnb — или напрямую: обычно это экономит до 15% и даёт гибкий заезд, WhatsApp-консьержа и бонусы по прибытии. Говорим EN / RU / TH / UK.",faq_h:"FAQ",faq_html:"<div class='faq'><div class='q'>Сколько бассейнов в Massarossa?</div><p>5 частных бассейнов — по одному в каждой вилле, без общих.</p><div class='q'>Какие виллы с водными горками?</div><p>King Family VIP (горка + бильярд + караоке) и Princess (горка + горячая ванна).</p><div class='q'>Сколько гостей вмещает каждая вилла?</div><p>8 гостей базово (+2 доп. по ฿500/ночь). Queen достигает 10.</p><div class='q'>Какие дополнительные платежи?</div><p>Электричество ฿6/кВт·ч; доп. гость ฿500/ночь; питомец ฿500/ночь (макс 2, до 10 кг); депозит ฿5,000 (возвращается).</p></div>",cta_sub:"Смотрите свободные даты, фото и горки в действии.",seeall:"Все 5 вилл",book:"Бронировать в WhatsApp"},
th:{back:"← กลับหน้าหลัก",kick:"คู่มือครอบครัว · พัทยา",t_title:"วิลล่าครอบครัวที่ดีที่สุดในพัทยา: คู่มือครบฉบับ 2026",t_intro:"วางแผนทริปครอบครัวไปพัทยา? ที่พักคือตัวตัดสินวันหยุด: ห้องแคบและสระรวม หรือวิลล่าส่วนตัวที่เด็กเล่นในสระของตัวเอง พ่อแม่ทำงานบน WiFi เร็ว นี่คือสเปคยืนยันแล้วของวิลล่าทั้ง 5 หลังของ Massarossa",s1_h:"พูลวิลล่าคืออะไร ทำไมครอบครัวถึงเลือก",s1_p:"พูลวิลล่าคือบ้านเดี่ยวพร้อมสระส่วนตัว ครัว และห้องนอน แก้ 3 ปัญหาของโรงแรม: พื้นที่ (ทุกคนในบ้านเดียว) จังหวะ (ครัวและตารางของตัวเอง) ความเป็นส่วนตัว (สระเป็นของคุณ ไม่มีคิว)",s2_h:"7 เช็คลิสต์วิลล่าครอบครัวตัวจริง",s2_list:"<ul><li><b>สระส่วนตัวทุกหลัง</b> — 5 วิลล่า = 5 สระ ไม่แชร์</li><li><b>สไลเดอร์น้ำ</b> — King Family VIP (สไลเดอร์+บิลเลียด+คาราโอเกะ) และ Princess (สไลเดอร์+อ่างน้ำร้อน)</li><li><b>WiFi 500+ Mbps</b> — ทำงานทางไกลและ 4K ทุกห้อง</li><li><b>พื้นที่จริง 197–250 ตร.ม.</b> — 3 ห้องนอน 8 ท่าน (+2; Queen ถึง 10)</li><li><b>ความปลอดภัย</b> — หมู่บ้านมีรั้ว รปภ. 24 ชม.</li><li><b>ครัว BBQ คาราโอเกะ</b> — ประหยัดค่าอาหาร ความสนุกยามเย็น</li><li><b>รับสัตว์เลี้ยง</b> — ฿500/ตัว/คืน สูงสุด 2 ตัว ≤10 กก.</li></ul>",s3_h:"วิลล่าทั้ง 5 ของ Massarossa: สเปคยืนยัน",s3_table:"<table><tr><th>วิลล่า</th><th>นอน/น้ำ</th><th>แขก</th><th>พื้นที่</th><th>จุดเด่น</th><th>เหมาะกับ</th><th>฿/คืน</th></tr><tr><td>King Family VIP</td><td>3/2</td><td>8(+2)</td><td>250</td><td>สไลเดอร์+บิลเลียด</td><td>ครอบครัว</td><td>4,900</td></tr><tr><td>Luxury</td><td>3/3</td><td>8(+2)</td><td>200</td><td>ดีไซน์ยุโรป</td><td>คู่รัก</td><td>4,500</td></tr><tr><td>Royal SPA</td><td>3/2</td><td>8(+2)</td><td>197</td><td>อ่างสปา</td><td>งานฉลอง</td><td>4,500</td></tr><tr><td>Princess</td><td>3/2</td><td>8(+2)</td><td>200</td><td>โรแมนติก+สไลเดอร์</td><td>ฮันนีมูน</td><td>4,600</td></tr><tr><td>Queen</td><td>3/2</td><td>8(+2=10)</td><td>200</td><td>อินฟินิตี้</td><td>เพื่อน/workation</td><td>4,500</td></tr></table>",s4_h:"เสียงจากแขกจริง",s4_quotes:"<div class='quote'>“วิลล่าสวยมาก สระส่วนตัวเยี่ยม เด็ก ๆ ชอบสไลเดอร์ในวิลล่า VIP!”<b>Sarah M. — ออสเตรเลีย</b><small>via Booking.com</small></div><div class='quote'>“สะอาด กว้าง ทำเลดีใกล้ Terminal 21”<b>Li Wei — จีน</b><small>via Agoda</small></div>",s5_h:"วิธีจองวิลล่าครอบครัวในพัทยา",s5_p:"จองผ่าน Booking.com, Agoda, Airbnb — หรือโดยตรง ประหยัดถึง 15% เช็คอินยืดหยุ่น คอนเซียร์จ WhatsApp พูดได้ EN / RU / TH / UK",faq_h:"คำถามที่พบบ่อย",faq_html:"<div class='faq'><div class='q'>Massarossa มีกี่สระ?</div><p>สระส่วนตัว 5 สระ — หลังละสระ ไม่แชร์</p><div class='q'>วิลล่าไหนมีสไลเดอร์?</div><p>King Family VIP (สไลเดอร์+บิลเลียด+คาราโอเกะ) และ Princess (สไลเดอร์+อ่างน้ำร้อน)</p><div class='q'>พักได้กี่ท่าน?</div><p>8 ท่าน (+2 เสริม ฿500/คืน) Queen ถึง 10</p><div class='q'>ค่าใช้จ่ายเพิ่มเติม?</div><p>ค่าไฟ ฿6/kWh แขกเสริม ฿500/คืน สัตว์เลี้ยง ฿500/คืน (สูงสุด 2 ตัว ≤10 กก.) มัดจำ ฿5,000 คืนให้</p></div>",cta_sub:"ดูวันว่าง ภาพถ่าย และสไลเดอร์",seeall:"ดูวิลล่าทั้ง 5",book:"จองผ่าน WhatsApp"},
zh:{back:"← 返回首页",kick:"家庭指南 · 芭提雅",t_title:"芭提雅最佳家庭别墅：2026完整指南",t_intro:"计划带家人去芭提雅？住宿决定假期质量：拥挤的酒店房和公共泳池，还是私人泳池别墅——孩子在自家泳池安全玩耍，父母用高速WiFi办公。以下是Massarossa全部5栋别墅的验证数据。",s1_h:"什么是泳池别墅，为什么家庭选择它",s1_p:"泳池别墅是带私人泳池、厨房和卧室的独立住宅。它解决酒店三大痛点：空间（全家住一栋）、节奏（自己的厨房和作息）、隐私（泳池只属于你——不排队）。",s2_h:"真正适合家庭的7个标准",s2_list:"<ul><li><b>每栋私人泳池</b> — 5栋=5个私人泳池，不共享。</li><li><b>水滑梯</b> — King Family VIP（滑梯+台球+卡拉OK）和Princess（滑梯+热水浴缸）。</li><li><b>WiFi 500+ Mbps</b> — 每间房远程办公和4K。</li><li><b>真实空间197–250㎡</b> — 3卧，8人(+2；Queen可达10)。</li><li><b>安全</b> — 封闭社区，24/7安保。</li><li><b>厨房、烧烤、卡拉OK</b> — 节省餐费，晚间娱乐。</li><li><b>宠物友好</b> — ฿500/宠物/晚，最多2只≤10kg。</li></ul>",s3_h:"Massarossa全部5栋别墅：验证规格",s3_table:"<table><tr><th>别墅</th><th>卧/卫</th><th>人数</th><th>面积</th><th>特色</th><th>适合</th><th>฿/晚</th></tr><tr><td>King Family VIP</td><td>3/2</td><td>8(+2)</td><td>250</td><td>滑梯+台球</td><td>家庭</td><td>4,900</td></tr><tr><td>Luxury</td><td>3/3</td><td>8(+2)</td><td>200</td><td>欧式设计</td><td>情侣</td><td>4,500</td></tr><tr><td>Royal SPA</td><td>3/2</td><td>8(+2)</td><td>197</td><td>SPA浴缸</td><td>庆祝</td><td>4,500</td></tr><tr><td>Princess</td><td>3/2</td><td>8(+2)</td><td>200</td><td>浪漫+滑梯</td><td>蜜月</td><td>4,600</td></tr><tr><td>Queen</td><td>3/2</td><td>8(+2=10)</td><td>200</td><td>无边泳池</td><td>朋友/办公</td><td>4,500</td></tr></table>",s4_h:"真实住客评价",s4_quotes:"<div class='quote'>“别墅太棒了，私人泳池是家庭的梦想，孩子们喜欢VIP别墅的滑梯！”<b>Sarah M. — 澳大利亚</b><small>via Booking.com</small></div><div class='quote'>“干净宽敞，位置靠近Terminal 21。”<b>Li Wei — 中国</b><small>via Agoda</small></div>",s5_h:"如何预订芭提雅家庭别墅",s5_p:"可通过Booking.com、Agoda、Airbnb预订，或直接预订——通常省15%，灵活入住、WhatsApp礼宾。支持EN / RU / TH / UK。",faq_h:"常见问题",faq_html:"<div class='faq'><div class='q'>Massarossa有几个泳池？</div><p>5个私人泳池——每栋一个，不共享。</p><div class='q'>哪些别墅带水滑梯？</div><p>King Family VIP（滑梯+台球+卡拉OK）和Princess（滑梯+热水浴缸）。</p><div class='q'>每栋住多少人？</div><p>标准8人(+2加人每晚฿500)。Queen可达10人。</p><div class='q'>有哪些额外费用？</div><p>电费฿6/度；加人每晚฿500；宠物每晚฿500（最多2只≤10kg）；押金฿5,000（可退）。</p></div>",cta_sub:"查看空档、照片和水滑梯实拍。",seeall:"查看全部5栋",book:"WhatsApp预订"},
ko:{back:"← 홈으로",kick:"가족 가이드 · 파타야",t_title:"파타야 최고 가족 빌라: 2026 완전 가이드",t_intro:"파타야 가족 여행을 계획 중인가요? 숙소가 휴가의 질을 좌우합니다: 비좁은 호텔과 공용 풀, 아니면 프라이빗 풀빌라 — 아이는自家 풀에서 안전하게 놀고 부모는 고속 WiFi로 일합니다. Massarossa 빌라 5동의 검증된 데이터를 제공합니다.",s1_h:"풀빌라란 무엇이며 왜 가족이 선택하나",s1_p:"풀빌라는 전용 풀, 주방, 침실을 갖춘 독립 주택입니다. 호텔 3대 고민을 해결: 공간(온 가족 한 집), 일상(자신만의 주방·일정), 프라이버시(풀은 나만 — 줄 없음).",s2_h:"진짜 가족 빌라의 7가지 기준",s2_list:"<ul><li><b>빌라당 프라이빗 풀</b> — 5동=5풀, 공유 없음.</li><li><b>워터슬라이드</b> — King Family VIP(슬라이드+당구+카라오케)와 Princess(슬라이드+온수 욕조).</li><li><b>WiFi 500+ Mbps</b> — 모든 방 원격 근무·4K.</li><li><b>실제 공간 197–250㎡</b> — 침실 3, 8인(+2; Queen 최대 10).</li><li><b>안전</b> — 게이트 커뮤니티, 24/7 보안.</li><li><b>주방, BBQ, 카라오케</b> — 식비 절약, 저녁 오락거리.</li><li><b>펫 프렌들리</b> — ฿500/마리/박, 최대 2마리 ≤10kg.</li></ul>",s3_h:"Massarossa 빌라 5동: 검증된 사양",s3_table:"<table><tr><th>빌라</th><th>침/욕</th><th>인원</th><th>면적</th><th>특징</th><th>추천</th><th>฿/박</th></tr><tr><td>King Family VIP</td><td>3/2</td><td>8(+2)</td><td>250</td><td>슬라이드+당구</td><td>가족</td><td>4,900</td></tr><tr><td>Luxury</td><td>3/3</td><td>8(+2)</td><td>200</td><td>유럽식</td><td>커플</td><td>4,500</td></tr><tr><td>Royal SPA</td><td>3/2</td><td>8(+2)</td><td>197</td><td>SPA 욕조</td><td>기념일</td><td>4,500</td></tr><tr><td>Princess</td><td>3/2</td><td>8(+2)</td><td>200</td><td>로맨스+슬라이드</td><td>허니문</td><td>4,600</td></tr><tr><td>Queen</td><td>3/2</td><td>8(+2=10)</td><td>200</td><td>인피니티</td><td>친구/워케이션</td><td>4,500</td></tr></table>",s4_h:"실제 투숙객 후기",s4_quotes:"<div class='quote'>“빌라가 정말 훌륭했어요. 아이들이 VIP 빌라 슬라이드를 좋아했어요!”<b>Sarah M. — 호주</b><small>via Booking.com</small></div><div class='quote'>“깨끗하고 넓어요. Terminal 21 인근 최고 위치.”<b>Li Wei — 중국</b><small>via Agoda</small></div>",s5_h:"파타야 가족 빌라 예약 방법",s5_p:"Booking.com, Agoda, Airbnb에서 예약하거나 직접 예약 — 보통 15% 절약, 유연한 체크인, WhatsApp 컨시어지. EN / RU / TH / UK 지원.",faq_h:"FAQ",faq_html:"<div class='faq'><div class='q'>Massarossa 풀은 몇 개?</div><p>프라이빗 풀 5개 — 빌라당 1개, 공유 없음.</p><div class='q'>어떤 빌라에 슬라이드가 있나요?</div><p>King Family VIP(슬라이드+당구+카라오케)와 Princess(슬라이드+온수 욕조).</p><div class='q'>빌라당 몇 명?</div><p>기본 8인(+2 추가 1박 ฿500). Queen 최대 10인.</p><div class='q'>추가 요금은?</div><p>전기 ฿6/kWh; 추가 인원 1박 ฿500; 애완동물 1박 ฿500(최대 2마리 ≤10kg); 보증금 ฿5,000(환불).</p></div>",cta_sub:"빈 객실, 사진, 워터슬라이드 실물 보기.",seeall:"빌라 5동 보기",book:"WhatsApp 예약"}};
