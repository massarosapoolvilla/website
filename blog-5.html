en:{back:"← Back to Home",kick:"Family + Workation · Pattaya",t_title:"Family-Friendly Accommodation in Pattaya: 500 Mbps WiFi + Private Pools",t_intro:"Modern family travel is a hybrid: kids need a safe pool to play in, while parents often need to work between swims. That combination — fast WiFi + private pool — is exactly what Massarossa is built for. Here's how a villa compares to a hotel or condo for a Pattaya family stay.",s1_h:"Villa vs Hotel vs Condo for families",s1_table:"<table><tr><th>Feature</th><th>Massarossa Villa</th><th>Family Hotel</th><th>Condo</th></tr><tr><td>Pool</td><td>Private (one per villa)</td><td>Shared, crowded</td><td>Shared rooftop</td></tr><tr><td>WiFi</td><td>500+ Mbps</td><td>20–100 Mbps</td><td>Variable</td></tr><tr><td>Space (6–10 ppl)</td><td>197–250 m² whole house</td><td>2–3 small rooms</td><td>1–2 rooms</td></tr><tr><td>Kitchen</td><td>Full</td><td>No/mini</td><td>Partial</td></tr><tr><td>Water slide</td><td>Yes (King VIP, Princess)</td><td>No</td><td>No</td></tr><tr><td>Pets</td><td>Yes</td><td>Rarely</td><td>Sometimes</td></tr><tr><td>Cost for 8</td><td>≈฿563–613/person</td><td>Higher</td><td>Similar, less space</td></tr></table>",s2_h:"Why 500 Mbps WiFi matters for families",s2_list:"<ul><li><b>Parents work:</b> stable video calls, VPN, large uploads — no café-hopping.</li><li><b>Kids stream:</b> 4K cartoons on the Smart TV while adults work.</li><li><b>Everyone connected:</b> phones, tablets, laptops — simultaneously, no slowdown.</li></ul>",s3_h:"The workation setup at Massarossa",s3_list:"<ul><li>Dedicated workspace / dining table in every villa.</li><li>Soundproofed bedrooms in <b>Luxury</b> for focused calls.</li><li>Private pool for a 30-min reset between meetings.</li><li>24/7 gated security so you can work with the door open.</li></ul>",s4_h:"Family features that matter",s4_list:"<ul><li>Safe pool zones — parents supervise from the terrace.</li><li>Water slides in <b>King Family VIP</b> & <b>Princess</b> keep kids busy for hours.</li><li>Full kitchen — cook for picky eaters, save on restaurants.</li><li>Gated community — kids roam safely, 24/7 security.</li></ul>",faq_h:"FAQ",faq_html:"<div class='faq'><div class='q'>Is Massarossa good for remote work?</div><p>Yes — 500+ Mbps WiFi throughout, workspaces, soundproofed bedrooms (Luxury), private pool for breaks.</p><div class='q'>How many pools?</div><p>5 private pools — one per villa, never shared.</p><div class='q'>Is a villa better than a hotel for a family?</div><p>For 6–10 people, usually cheaper per person than several hotel rooms, with more space, a kitchen and a private pool.</p><div class='q'>Can kids and pets stay safely?</div><p>Yes — gated 24/7 security, safe pool zones, pet-friendly (฿500/pet/night, max 2, ≤10 kg).</p></div>",cta_sub:"Work in the morning, pool in the afternoon.",seeall:"See All 5 Villas",book:"Book via WhatsApp"},
ua:{back:"← На головну",kick:"Сім'я + Воркейшн · Паттайя",t_title:"Сімейне житло в Паттайї: WiFi 500 Мбіт/с + приватні басейни",t_intro:"Сучасна сімейна подорож — гібрид: дітям потрібен безпечний басейн, а батькам часто треба працювати між купаннями. Саме ця комбінація — швидкий WiFi + приватний басейн — те, для чого створена Massarossa. Ось як вілла порівнюється з готелем чи кондо.",s1_h:"Вілла vs готель vs кондо для сім'ї",s1_table:"<table><tr><th>Критерій</th><th>Вілла Massarossa</th><th>Сімейний готель</th><th>Кондо</th></tr><tr><td>Басейн</td><td>Приватний (по одному на віллу)</td><td>Спільний, натовп</td><td>Спільний дах</td></tr><tr><td>WiFi</td><td>500+ Мбіт/с</td><td>20–100 Мбіт/с</td><td>Змінний</td></tr><tr><td>Простір (6–10)</td><td>197–250 м² весь будинок</td><td>2–3 малі кімнати</td><td>1–2 кімнати</td></tr><tr><td>Кухня</td><td>Повна</td><td>Ні/міні</td><td>Часткова</td></tr><tr><td>Гірка</td><td>Так (King VIP, Princess)</td><td>Ні</td><td>Ні</td></tr><tr><td>Тварини</td><td>Так</td><td>Зрідка</td><td>Іноді</td></tr><tr><td>Вартість на 8</td><td>≈฿563–613/особа</td><td>Вище</td><td>Схожа, менше простору</td></tr></table>",s2_h:"Чому WiFi 500 Мбіт/с важливий для сімей",s2_list:"<ul><li><b>Батьки працюють:</b> стабільні відеодзвінки, VPN, великі завантаження — без кафе.</li><li><b>Діти стримлять:</b> 4K-мультики на Smart TV, поки дорослі працюють.</li><li><b>Усі підключені:</b> телефони, планшети, ноутбуки — одночасно, без гальм.</li></ul>",s3_h:"Воркейшн-сетап у Massarossa",s3_list:"<ul><li>Робоче місце / обідній стіл у кожній віллі.</li><li>Шумоізольовані спальні у <b>Luxury</b> для зосереджених дзвінків.</li><li>Приватний басейн для 30-хв перезапуску між зустрічами.</li><li>Охорона 24/7 — можна працювати з відчиненими дверима.</li></ul>",s4_h:"Сімейні фішки, що важливі",s4_list:"<ul><li>Безпечні зони басейну — батьки наглядають з тераси.</li><li>Гірки у <b>King Family VIP</b> і <b>Princess</b> займають дітей на години.</li><li>Повна кухня — готуйте для вибагливих їжаків, економте на ресторанах.</li><li>Закрита спільнота — діти безпечно бігають, охорона 24/7.</li></ul>",faq_h:"FAQ",faq_html:"<div class='faq'><div class='q'>Чи підходить Massarossa для віддаленої роботи?</div><p>Так — WiFi 500+ Мбіт/с всюди, робочі місця, шумоізольовані спальні (Luxury), приватний басейн для перерв.</p><div class='q'>Скільки басейнів?</div><p>5 приватних басейнів — по одному на віллу, без спільних.</p><div class='q'>Вілла краща за готель для сім'ї?</div><p>Для 6–10 осіб зазвичай дешевше на особу, ніж кілька готельних номерів, з більшим простором, кухнею і приватним басейном.</p><div class='q'>Чи можуть діти і тварини перебувати безпечно?</div><p>Так — охорона 24/7, безпечні зони басейну, pet-friendly (฿500/тварина/ніч, макс 2, ≤10 кг).</p></div>",cta_sub:"Вранці — робота, вдень — басейн.",seeall:"Усі 5 вілл",book:"Бронювати у WhatsApp"},
ru:{back:"← На главную",kick:"Семья + Workation · Паттайя",t_title:"Семейное жильё в Паттайе: WiFi 500 Мбит/с + частные бассейны",t_intro:"Современная семейная поездка — гибрид: детям нужен безопасный бассейн, а родителям часто надо работать между купаниями. Именно эта комбинация — быстрый WiFi + частный бассейн — то, для чего создана Massarossa. Вот как вилла сравнивается с отелем или кондо.",s1_h:"Вилла vs отель vs кондо для семьи",s1_table:"<table><tr><th>Критерий</th><th>Вилла Massarossa</th><th>Семейный отель</th><th>Кондо</th></tr><tr><td>Бассейн</td><td>Частный (по одному на виллу)</td><td>Общий, толпа</td><td>Общая крыша</td></tr><tr><td>WiFi</td><td>500+ Мбит/с</td><td>20–100 Мбит/с</td><td>Переменный</td></tr><tr><td>Пространство (6–10)</td><td>197–250 м² весь дом</td><td>2–3 мал. комнаты</td><td>1–2 комнаты</td></tr><tr><td>Кухня</td><td>Полная</td><td>Нет/мини</td><td>Частичная</td></tr><tr><td>Горка</td><td>Да (King VIP, Princess)</td><td>Нет</td><td>Нет</td></tr><tr><td>Питомцы</td><td>Да</td><td>Редко</td><td>Иногда</td></tr><tr><td>Стоимость на 8</td><td>≈฿563–613/чел</td><td>Выше</td><td>Похожая, меньше места</td></tr></table>",s2_h:"Почему WiFi 500 Мбит/с важен для семей",s2_list:"<ul><li><b>Родители работают:</b> стабильные видеозвонки, VPN, большие загрузки — без кафе.</li><li><b>Дети стримят:</b> 4K-мультики на Smart TV, пока взрослые работают.</li><li><b>Все подключены:</b> телефоны, планшеты, ноутбуки — одновременно, без тормозов.</li></ul>",s3_h:"Workation-сетап в Massarossa",s3_list:"<ul><li>Рабочее место / обеденный стол в каждой вилле.</li><li>Шумоизолированные спальни в <b>Luxury</b> для сосредоточенных звонков.</li><li>Частный бассейн для 30-мин перезапуска между встречами.</li><li>Охрана 24/7 — можно работать с открытой дверью.</li></ul>",s4_h:"Семейные фишки, которые важны",s4_list:"<ul><li>Безопасные зоны бассейна — родители наблюдают с террасы.</li><li>Горки в <b>King Family VIP</b> и <b>Princess</b> занимают детей на часы.</li><li>Полная кухня — готовьте для приверед, экономьте на ресторанах.</li><li>Закрытое сообщество — дети безопасно бегают, охрана 24/7.</li></ul>",faq_h:"FAQ",faq_html:"<div class='faq'><div class='q'>Подходит ли Massarossa для удалёнки?</div><p>Да — WiFi 500+ Мбит/с везде, рабочие места, шумоизолированные спальни (Luxury), частный бассейн для перерывов.</p><div class='q'>Сколько бассейнов?</div><p>5 частных бассейнов — по одному на виллу, без общих.</p><div class='q'>Вилла лучше отеля для семьи?</div><p>Для 6–10 человек обычно дешевле на человека, чем несколько номеров, с большим пространством, кухней и частным бассейном.</p><div class='q'>Могут ли дети и питомцы находиться безопасно?</div><p>Да — охрана 24/7, безопасные зоны бассейна, pet-friendly (฿500/питомец/ночь, макс 2, ≤10 кг).</p></div>",cta_sub:"Утром — работа, днём — бассейн.",seeall:"Все 5 вилл",book:"Бронировать в WhatsApp"},

 เหมาะกับทำงานทางไกลไหม?</div><p>เหมาะ — WiFi 500+ Mbps ทั่ว ที่ทำงาน ห้องนอนกันเสียง (Luxury) สระส่วนตัวสำหรับพัก</p><div class='q'>มีกี่สระ?</div><p>สระส่วนตัว 5 สระ — หลังละสระ ไม่แชร์</p><div class='q'>วิลล่าดีกว่าโรงแรมสำหรับครอบครัวไหม?</div><p>สำหรับ 6–10 คน มักถูกกว่าต่อคนกว่าห้องโรงแรมหลายห้อง พร้อมพื้นที่ ครัว และสระส่วนตัว</p><div class='q'>เด็กและสัตว์เลี้ยงพักปลอดภัยไหม?</div><p>ปลอดภัย — รปภ. 24 ชม. โซนสระปลอดภัย รับสัตว์เลี้ยง (฿500/ตัว/คืน สูงสุด 2 ตัว ≤10 กก.)</p></div>",cta_sub:"เช้าทำงาน บ่ายว่ายน้ำ",seeall:"ดูวิลล่าทั้ง 5",book:"จองผ่าน WhatsApp"},
zh:{back:"← 返回首页",kick:"家庭+远程办公 · 芭提雅",t_title:"芭提雅家庭住宿：500 Mbps WiFi + 私人泳池",t_intro:"现代家庭旅行是混合体：孩子需要安全的泳池，父母常需在工作间隙游泳。这种组合——快WiFi+私人泳池——正是Massarossa为之打造的。以下是别墅与酒店、公寓的对比。",s1_h:"家庭：别墅 vs 酒店 vs 公寓",s1_table:"<table><tr><th>特点</th><th>Massarossa 别墅</th><th>家庭酒店</th><th>公寓</th></tr><tr><td>泳池</td><td>私人（每栋一个）</td><td>共用、拥挤</td><td>共用天台</td></tr><tr><td>WiFi</td><td>500+ Mbps</td><td>20–100 Mbps</td><td>不定</td></tr><tr><td>空间(6–10人)</td><td>197–250㎡ 整栋</td><td>2–3小房</td><td>1–2房</td></tr><tr><td>厨房</td><td>全套</td><td>无/迷你</td><td>部分</td></tr><tr><td>水滑梯</td><td>有（King VIP、Princess）</td><td>无</td><td>无</td></tr><tr><td>宠物</td><td>可</td><td>很少</td><td>有时</td></tr><tr><td>8人成本</td><td>≈฿563–613/人</td><td>更高</td><td>相近、空间小</td></tr></table>",s2_h:"为什么500 Mbps WiFi对家庭重要",s2_list:"<ul><li><b>父母办公：</b>稳定视频通话、VPN、大上传——不用跑咖啡馆。</li><li><b>孩子流媒体：</b>大人工作时Smart TV放4K动画。</li><li><b>全员连接：</b>手机、平板、笔记本——同时不卡。</li></ul>",s3_h:"Massarossa 的 workation 配置",s3_list:"<ul><li>每栋别墅有专用工作区/餐桌。</li><li><b>Luxury</b> 隔音卧室，专注通话。</li><li>私人泳池，会议间30分钟放松。</li><li>24/7安保，可开门办公。</li></ul>",s4_h:"重要的家庭配置",s4_list:"<ul><li>安全泳池区——父母从露台看护。</li><li><b>King Family VIP</b> 和 <b>Princess</b> 的水滑梯让孩子玩几小时。</li><li>全套厨房——为挑食者做饭，省下餐厅钱。</li><li>封闭社区——孩子安全活动，24/7安保。</li></ul>",faq_h:"常见问题",faq_html:"<div class='faq'><div class='q'>Massarossa 适合远程办公吗？</div><p>适合——全屋500+ Mbps WiFi、工作区、隔音卧室（Luxury）、私人泳池休息。</p><div class='q'>有几个泳池？</div><p>5个私人泳池——每栋一个，不共享。</p><div class='q'>别墅比酒店更适合家庭吗？</div><p>对6–10人，人均通常比几间酒店房便宜，空间更大、有厨房和私人泳池。</p><div class='q'>孩子和宠物能安全入住吗？</div><p>能——24/7安保、安全泳池区、宠物友好（฿500/宠物/晚，最多2只≤10kg）。</p></div>",cta_sub:"上午办公，下午游泳。",seeall:"查看全部5栋",book:"WhatsApp预订"},
ko:{back:"← 홈으로",kick:"가족+워케이션 · 파타야",t_title:"파타야 가족 숙박: 500 Mbps WiFi + 프라이빗 풀",t_intro:"현대 가족 여행은 하이브리드: 아이는 안전한 풀이 필요하고 부모는 수영 사이 일해야 합니다. 빠른 WiFi+프라이빗 풀의 조합이 바로 Massarossa가 만든 것입니다. 빌라와 호텔, 콘도 비교입니다.",s1_h:"가족을 위한 빌라 vs 호텔 vs 콘도",s1_table:"<table><tr><th>특징</th><th>Massarossa 빌라</th><th>가족 호텔</th><th>콘도</th></tr><tr><td>풀</td><td>프라이빗(빌라당 1개)</td><td>공용, 붐</td><td>공용 옥상</td></tr><tr><td>WiFi</td><td>500+ Mbps</td><td>20–100 Mbps</td><td>가변</td></tr><tr><td>공간(6–10인)</td><td>197–250㎡ 전체</td><td>작은 방 2–3</td><td>방 1–2</td></tr><tr><td>주방</td><td>풀</td><td>없음/미니</td><td>부분</td></tr><tr><td>슬라이드</td><td>있음(King VIP, Princess)</td><td>없음</td><td>없음</td></tr><tr><td>애완</td><td>가능</td><td>드물게</td><td>가끔</td></tr><tr><td>8인 비용</td><td>≈฿563–613/인</td><td>더 높음</td><td>비슷, 공간 적음</td></tr></table>",s2_h:"가족에게 500 Mbps WiFi가 중요한 이유",s2_list:"<ul><li><b>부모 근무:</b> 안정적 화상통화, VPN, 대용량 업로드 — 카페 전전 없음.</li><li><b>아이 스트리밍:</b> 어른 근무 중 Smart TV 4K 만화.</li><li><b>전원 연결:</b> 폰·태블릿·노트북 — 동시에, 느려짐 없음.</li></ul>",s3_h:"Massarossa 워케이션 세팅",s3_list:"<ul><li>모든 빌라에 전용 워크스페이스/식탁.</li><li><b>Luxury</b> 방음 침실, 집중 통화.</li><li>회의 사이 30분 리셋용 프라이빗 풀.</li><li>24/7 보안, 문 열고 근무 가능.</li></ul>",s4_h:"중요한 가족 기능",s4_list:"<ul><li>안전 풀 구역 — 테라스에서 감독.</li><li><b>King Family VIP</b>·<b>Princess</b> 슬라이드로 아이를 몇 시간 즐겁게.</li><li>풀키친 — 편식 아이 요리, 외식 절약.</li><li>게이트 커뮤니티 — 아이 안전, 24/7 보안.</li></ul>",faq_h:"FAQ",faq_html:"<div class='faq'><div class='q'>Massarossa는 원격 근무에 적합한가요?</div><p>네 — 전역 500+ Mbps WiFi, 워크스페이스, 방음 침실(Luxury), 휴식용 프라이빗 풀.</p><div class='q'>풀은 몇 개인가요?</div><p>프라이빗 풀 5개 — 빌라당 1개, 공유 없음.</p><div class='q'>가족에게 빌라가 호텔보다 나은가요?</div><p>6–10인이면 호텔 여러 방보다 인당 저렴, 더 넓은 공간·주방·프라이빗 풀.</p><div class='q'>아이와 애완이 안전하게 머물 수 있나요?</div><p>네 — 24/7 보안, 안전 풀 구역, 펫 프렌들리(฿500/마리/박, 최대 2마리 ≤10kg).</p></div>",cta_sub:"오전엔 근무, 오후엔 풀.",seeall:"빌라 5동 보기",book:"WhatsApp 예약"}};
